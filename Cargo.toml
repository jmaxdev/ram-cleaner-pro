[package]
name = "ram-pro"
version = "1.0.3"
edition = "2021"
authors = ["jmaxdev"]
description = "Complete RAM memory purge and optimization utility for Windows"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader"
] }
sysinfo = "0.30"
eframe = "0.28"
egui = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
tray-icon = "0.14"
image = "0.25"
directories = "5.0"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "blocking"] }
semver = "1.0"
self-replace = "1.3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
